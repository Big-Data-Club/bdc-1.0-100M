model:
  vocab_size: 512
  hidden_size: 128
  num_layers: 2
  num_attention_heads: 4
  num_key_value_heads: 2
  intermediate_size: 352
  max_seq_len: 128
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5
  dropout: 0.0
  tie_word_embeddings: true

training:
  train_data: data/train.bin
  val_data: data/val.bin
  output_dir: outputs/debug
  seed: 1337
  micro_batch_size: 2
  gradient_accumulation_steps: 2
  max_steps: 20
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 2
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  dtype: float32
  compile: false
  log_interval: 1
  eval_interval: 10
  eval_batches: 2
  checkpoint_interval: 10
  keep_last_checkpoints: 2
  resume_from: null
