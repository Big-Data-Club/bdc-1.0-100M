model:
  vocab_size: 32000
  hidden_size: 768
  num_layers: 12
  num_attention_heads: 12
  num_key_value_heads: 4
  intermediate_size: 2048
  max_seq_len: 1024
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5
  dropout: 0.0
  tie_word_embeddings: true

training:
  train_data: data/train.bin
  val_data: data/val.bin
  output_dir: outputs/bdc-1.0-100M
  seed: 1337

  # Conservative defaults for a modest GPU. Increase micro_batch_size if memory permits.
  micro_batch_size: 2
  gradient_accumulation_steps: 32
  max_steps: 20000

  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 1000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0

  dtype: bfloat16
  compile: false

  log_interval: 10
  eval_interval: 500
  eval_batches: 50
  checkpoint_interval: 1000
  keep_last_checkpoints: 3

  # Empty/null means start from scratch. Set to a checkpoint .pt to resume.
  resume_from: null
